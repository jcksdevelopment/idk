name: build

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Lua 5.4 (heartbeat interop tests)
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zip
      - name: Build, test and package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jcks_anticheat-resource
          path: dist/jcks_anticheat/

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
