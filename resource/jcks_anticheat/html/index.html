<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;pointer-events:none}</style>
<link rel="stylesheet" href="panel.css">
<script src="panel.js"></script>
</head>
<body>
<div id="jac-panel"></div>
<script>
(() => {
  const resource = typeof GetParentResourceName === "function" ? GetParentResourceName() : "jcks_anticheat";
  const sent = new Set();
  const report = (payload) => {
    const key = payload.kind + ":" + (payload.how || payload.src || payload.tag);
    if (sent.has(key)) return;
    sent.add(key);
    fetch(`https://${resource}/jac_sensor`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).catch(() => {});
  };

  const bait = new Image();
  Object.defineProperty(bait, "id", { get() { report({ kind: "devtools", how: "console-getter" }); return ""; } });
  setInterval(() => { console.debug("%c", bait); console.clear && console.clear(); }, 4000);

  setInterval(() => {
    const t = performance.now();
    debugger;
    if (performance.now() - t > 100) report({ kind: "devtools", how: "debugger-timing" });
  }, 5000);

  const baseline = new Set(document.querySelectorAll("script, iframe"));
  new MutationObserver((mutations) => {
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (!(node instanceof HTMLElement)) continue;
        const tag = node.tagName.toLowerCase();
        if ((tag === "iframe" || tag === "script" || tag === "object" || tag === "embed") && !baseline.has(node)) {
          report({ kind: "frame", tag, src: node.getAttribute("src") || "inline" });
        }
      }
    }
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
</body>
</html>
